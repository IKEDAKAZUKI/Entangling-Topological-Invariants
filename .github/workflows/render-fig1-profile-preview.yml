name: Render Figure 1 profile preview

on:
  pull_request:
    paths:
      - ".github/workflows/render-fig1-profile-preview.yml"
      - "entangling-topological-invariants/figures/fig1_zero_marginal.pdf"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PDF renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Render the first page as a profile-safe PNG
        run: |
          mkdir -p profile-preview
          pdftoppm \
            -f 1 \
            -singlefile \
            -png \
            -r 240 \
            "entangling-topological-invariants/figures/fig1_zero_marginal.pdf" \
            "profile-preview/fig1_zero_marginal"
          file "profile-preview/fig1_zero_marginal.png"

      - name: Upload rendered preview
        uses: actions/upload-artifact@v4
        with:
          name: fig1-zero-marginal-profile-preview
          path: profile-preview/fig1_zero_marginal.png
          if-no-files-found: error
          retention-days: 1
